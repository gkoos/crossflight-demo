# Docker's embedded DNS. Every name below is resolved per request: a plain name
# is resolved once, at load time, which would leave nginx proxying to addresses
# that no longer exist after the api containers are rebuilt.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_pool {
    # `resolve` needs a shared memory zone to hold the current addresses.
    zone api_pool 64k;
    server api_1:3000 resolve;
    server api_2:3000 resolve;
    server api_3:3000 resolve;
}

server {
    listen 80;

    # Off on purpose. The image defines `access_log /var/log/nginx/access.log`
    # at the http level, and that path is a symlink to /dev/stdout, so every
    # proxied request would land in `npm run logs` - one 20-request round would
    # bury the api instances' Crossflight lines. Re-enable it here with
    # `access_log /dev/stdout;` (the image's format is called `main`).
    access_log off;

    location / {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Demo-only inspection routes. A balanced request can only ever reach one
    # instance, so the load demo needs a way to ask a *named* instance what it
    # saw during the round. Reading /stats changes nothing it measures.
    location = /instances {
        default_type application/json;
        return 200 '{"instances":["api_1","api_2","api_3"]}';
    }

    location /instances/api_1/ {
        set $inspection_target api_1;
        rewrite ^/instances/api_1/(.*)$ /$1 break;
        proxy_pass http://$inspection_target:3000;
    }

    location /instances/api_2/ {
        set $inspection_target api_2;
        rewrite ^/instances/api_2/(.*)$ /$1 break;
        proxy_pass http://$inspection_target:3000;
    }

    location /instances/api_3/ {
        set $inspection_target api_3;
        rewrite ^/instances/api_3/(.*)$ /$1 break;
        proxy_pass http://$inspection_target:3000;
    }
}
